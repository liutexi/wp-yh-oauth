name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build plugin zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage plugin files
        run: |
          mkdir -p build/wp-yunhu-oauth
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='*.zip' \
            ./ build/wp-yunhu-oauth/

      - name: Zip
        run: |
          cd build
          zip -r ../wp-yunhu-oauth.zip wp-yunhu-oauth
          unzip -l ../wp-yunhu-oauth.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: wp-yunhu-oauth.zip
          generate_release_notes: true
          name: ${{ github.ref_name }}
